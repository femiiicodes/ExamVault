$kind: http-example
request:
  url: "{{baseUrl}}/auth/token"
  method: POST
  headers:
    Content-Type: application/x-www-form-urlencoded
    Accept: application/json
  body:
    type: urlencoded
    content:
      username: string
      password: string
      grant_type: password
      scope: ""
      client_id: string
      client_secret: string
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": [
          {
            "loc": [
              7186,
              9899
            ],
            "msg": "string",
            "type": "string"
          },
          {
            "loc": [
              5464,
              209
            ],
            "msg": "string",
            "type": "string"
          }
        ]
      }
order: 2000
