$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "first_name": "string",
      "last_name": "string",
      "email": "string",
      "level": "string",
      "department": "string",
      "role": "string",
      "password": "string"
    }
settings: {}
examples: ./.resources/Add User.resources/examples
order: 1000
