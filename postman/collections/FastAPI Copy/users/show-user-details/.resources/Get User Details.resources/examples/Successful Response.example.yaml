$kind: http-example
request:
  url: "{{baseUrl}}/users/show-user-details"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 8294,
        "first_name": "string",
        "last_name": "string",
        "email": "string",
        "level": "string",
        "department": "string",
        "role": "string"
      }
order: 1000
