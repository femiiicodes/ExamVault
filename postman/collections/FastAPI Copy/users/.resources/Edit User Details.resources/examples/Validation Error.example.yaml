$kind: http-example
request:
  url: "{{baseUrl}}/users/"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: json
    content: |-
      {
        "first_name": "string",
        "last_name": "string",
        "email": "string",
        "level": "string",
        "department": "string",
        "role": null
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": [
          {
            "loc": [
              7186,
              9899
            ],
            "msg": "string",
            "type": "string"
          },
          {
            "loc": [
              5464,
              209
            ],
            "msg": "string",
            "type": "string"
          }
        ]
      }
order: 2000
