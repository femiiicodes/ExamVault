$kind: http-example
request:
  url: "{{baseUrl}}/users/"
  method: PUT
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  body:
    type: json
    content: |-
      {
        "first_name": "string",
        "last_name": "string",
        "email": "string",
        "level": "string",
        "department": "string",
        "role": null
      }
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000
