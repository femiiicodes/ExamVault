$kind: http-example
request:
  url: "{{baseUrl}}/users/change-password?old_password=string&new_password=string"
  method: PUT
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
  queryParams:
    old_password: string
    new_password: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: ""
order: 1000
