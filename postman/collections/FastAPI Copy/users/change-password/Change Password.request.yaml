$kind: http-request
url: "{{baseUrl}}/users/change-password?old_password=string&new_password=string"
method: PUT
headers:
  Accept: application/json
queryParams:
  old_password: string
  new_password: string
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /auth/token
    grant_type: password_credentials
settings: {}
examples: ./.resources/Change Password.resources/examples
order: 1000
