<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Password — ExamVault</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/login-page.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand"><span class="brand-text">ExamVault</span></a>
        <div class="nav-links"><a href="/auth/login-page" class="nav-link nav-link--outline">Log In</a></div>
    </nav>
    <main class="login-page">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Recover your password</h1>
                <p class="login-subtitle" id="recoverySubtitle">Enter your email to continue.</p>
            </div>
            <form class="login-form" id="emailForm" novalidate>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required autocomplete="email">
                </div>
                <button class="btn btn--primary btn--full" type="submit" id="emailButton">Continue</button>
                <p class="form-status" id="emailStatus" role="status"></p>
            </form>
            <div id="securityPanel" hidden>
                <form class="login-form" id="securityForm" novalidate>
                    <div id="questionFields"></div>
                    <button class="btn btn--primary btn--full" type="submit">Verify answers</button>
                    <p class="form-status" id="securityStatus" role="alert"></p>
                </form>
            </div>
            <div id="emailConfirmation" hidden>
                <div class="recovery-divider">Check your inbox</div>
                <p class="form-status">If an account exists for this email, recovery instructions will be sent.</p>
            </div>
            <div class="login-footer"><p>Remembered your password? <a href="/auth/login-page" class="link">Log in</a></p></div>
        </div>
    </main>
    <script>
        const emailForm = document.getElementById('emailForm');
        const securityPanel = document.getElementById('securityPanel');
        const questionFields = document.getElementById('questionFields');
        const emailStatus = document.getElementById('emailStatus');
        const securityStatus = document.getElementById('securityStatus');
        const emailInput = document.getElementById('email');
        const recoverySubtitle = document.getElementById('recoverySubtitle');
        const emailConfirmation = document.getElementById('emailConfirmation');

        function setStatus(element, message, isError = false) {
            element.textContent = message;
            element.classList.toggle('is-error', isError);
        }

        async function requestJson(url, body) {
            const response = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || 'Recovery request failed.');
            return data;
        }

        emailForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = emailInput.value.trim();
            if (!email) {
                setStatus(emailStatus, 'Enter your email address.', true);
                return;
            }
            document.getElementById('emailButton').disabled = true;
            setStatus(emailStatus, 'Checking recovery options...');
            try {
                const recovery = await requestJson('/auth/password-recovery/start', {email});
                emailForm.hidden = true;
                if (recovery.method === 'security_questions') {
                    recoverySubtitle.textContent = 'Answer both questions to continue.';
                    questionFields.innerHTML = recovery.questions.map((question) => `
                        <div class="form-group">
                            <label for="answer-${question.id}">${question.text}</label>
                            <input type="text" id="answer-${question.id}" data-question-id="${question.id}" required autocomplete="off">
                        </div>
                    `).join('');
                    securityPanel.hidden = false;
                } else {
                    recoverySubtitle.textContent = 'Check your inbox for recovery instructions.';
                    emailConfirmation.hidden = false;
                }
            } catch (error) {
                setStatus(emailStatus, error.message, true);
            } finally {
                document.getElementById('emailButton').disabled = false;
            }
        });

        document.getElementById('securityForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const answers = [...questionFields.querySelectorAll('[data-question-id]')].map((input) => ({
                question_id: input.dataset.questionId,
                answer: input.value
            }));
            try {
                const data = await requestJson('/auth/password-recovery/security-verify', {
                    email: emailInput.value.trim(),
                    answers
                });
                window.location.href = '/auth/reset-password-page?token=' + encodeURIComponent(data.token);
            } catch (error) {
                setStatus(securityStatus, error.message, true);
            }
        });
    </script>
{% include 'partials/site-footer.html' %}
</body>
</html>
