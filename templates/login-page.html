<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — ExamVault</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static',path='css/login-page.css')}}">
<base target="_blank">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                <line x1="8" y1="7" x2="16" y2="7"/>
                <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
            <span class="brand-text">ExamVault</span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="register.html" class="nav-link nav-link--outline">Register</a>
        </div>
    </nav>

    <!-- Login Section -->
    <main class="login-page">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Welcome back</h1>
                <p class="login-subtitle">Log in to access your past questions and bookmarks.</p>
            </div>

            <form class="login-form" id="loginForm" novalidate>
                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="username" placeholder="you@school.edu" required>
                    <span class="error-msg" id="emailError">Please enter a valid email</span>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            <svg class="eye-icon" id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-icon hidden" id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span class="error-msg" id="passwordError">Password is required</span>
                </div>

                <!-- Admin Toggle -->
                <label class="remember-toggle">
                    <input type="checkbox" id="adminToggle" name="admin">
                    <span class="check-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </span>
                    <span class="remember-label">Sign in as admin</span>
                </label>

                <!-- Remember Me -->
                <label class="remember-toggle">
                    <input type="checkbox" id="rememberMe" name="remember">
                    <span class="check-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                    </span>
                    <span class="remember-label">Remember me for 30 days</span>
                </label>

                <!-- Submit -->
                <button type="submit" class="btn btn--primary btn--full" id="submitBtn">
                    Log In
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="register.html" class="link">Create one</a></p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 ExamVault. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        // Password visibility toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eyeOpen');
        const eyeClosed = document.getElementById('eyeClosed');

        toggleBtn.addEventListener('click', function() {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            eyeOpen.classList.toggle('hidden', isHidden);
            eyeClosed.classList.toggle('hidden', !isHidden);
        });

        // Form validation
        const form = document.getElementById('loginForm');

        function showError(id, show) {
            document.getElementById(id).classList.toggle('is-visible', show);
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            let valid = true;

            const email = document.getElementById('email').value.trim();
            showError('emailError', !validateEmail(email));
            if (!validateEmail(email)) valid = false;

            const password = document.getElementById('password').value;
            showError('passwordError', !password);
            if (!password) valid = false;

            if (valid) {
                const formData = new FormData(form);
                const data = new URLSearchParams(formData);
                data.set('admin', document.getElementById('adminToggle').checked ? 'true' : 'false');

                fetch('/auth/token', {
                    method: 'POST',
                    body: data,
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'}
                }).then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        showError('emailError', true);
                        showError('passwordError', true);
                        throw new Error('Login failed');
                    }
                }).then(data => {
                    const isAdmin = document.getElementById('adminToggle').checked;
                    if (isAdmin && data.is_admin) {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/dashboard';
                    }
                }).catch(err => console.error('Login error:', err));
            }
        });
    </script>
<script src="{{url_for('static',path='js/base.js')}}"></script>
</body>
</html>
