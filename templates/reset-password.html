<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — ExamVault</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/login-page.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand"><span class="brand-text">ExamVault</span></a>
        <div class="nav-links"><a href="/auth/login-page" class="nav-link nav-link--outline">Log In</a></div>
    </nav>
    <main class="login-page">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Set a new password</h1>
                <p class="login-subtitle">Choose a new password with at least 8 characters.</p>
            </div>
            <form class="login-form" id="resetForm" novalidate>
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" minlength="8" maxlength="128" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" minlength="8" maxlength="128" required autocomplete="new-password">
                </div>
                <button class="btn btn--primary btn--full" type="submit">Reset password</button>
                <p class="form-status" id="status" role="alert"></p>
            </form>
        </div>
    </main>
    <script>
        const form = document.getElementById('resetForm');
        const status = document.getElementById('status');
        const token = new URLSearchParams(window.location.search).get('token') || '';
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            status.classList.remove('is-error');
            if (password.length < 8 || password.length > 128) {
                status.textContent = 'Password must be between 8 and 128 characters.';
                status.classList.add('is-error');
                return;
            }
            if (password !== confirmPassword) {
                status.textContent = 'Passwords do not match.';
                status.classList.add('is-error');
                return;
            }
            try {
                const response = await fetch('/auth/password-reset/confirm', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token, password, confirm_password: confirmPassword})
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || 'Unable to reset password.');
                status.textContent = data.detail;
                window.setTimeout(() => { window.location.href = '/auth/login-page'; }, 1200);
            } catch (error) {
                status.textContent = error.message;
                status.classList.add('is-error');
            }
        });
    </script>
{% include 'partials/site-footer.html' %}
</body>
</html>
